<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핑크냥 튜브타임</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap');
        body { font-family: 'Gaegu', cursive; background-color: #fff9eb; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; width: 100%; max-width: 500px; border-radius: 30px; padding: 25px; border: 6px solid #ffcbef; box-shadow: 0 10px 0 #ff9ff3; position: relative; }
        
        /* 메인 고양이 아이콘 (로케트 대신) */
        .main-cat { width: 160px; display: block; margin: 0 auto 10px; transition: transform 0.3s ease; }
        .main-cat.grow { transform: scale(2); }
        
        .header h1 { text-align: center; color: #6c5ce7; font-size: 2.2rem; margin: 10px 0; }
        .rule-box { background: #fff5f5; border: 2px solid #ff7675; border-radius: 15px; padding: 15px; margin-bottom: 20px; font-size: 1.1rem; line-height: 1.6; }
        .rule-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .rule-item input { flex: 1; border: 1px dashed #ff7675; background: transparent; font-size: 1.1rem; padding: 5px; border-radius: 8px; }
        .rule-item button { background: #ff7675; color: white; border: none; border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-size: 14px; }
        .add-rule-btn { background: #ff7675; color: white; border: none; border-radius: 12px; padding: 8px 15px; cursor: pointer; font-family: 'Gaegu'; font-size: 1rem; margin-top: 10px; }

        /* 설정 섹션 */
        .settings-section { background: #e8f5e9; border: 2px solid #81c784; border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .settings-section h3 { margin: 0 0 15px 0; color: #388e3c; text-align: center; cursor: pointer; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .setting-item { display: flex; flex-direction: column; gap: 5px; }
        .setting-item label { font-size: 0.95rem; color: #388e3c; }
        .setting-item input { padding: 8px; border: 2px solid #81c784; border-radius: 10px; font-family: 'Gaegu'; font-size: 1rem; text-align: center; }
        .settings-content { display: none; }
        .settings-content.show { display: block; }
        
        /* 아이들 선택 버튼 (고양이 크게, 얼굴 삭제) */
        .child-selector { display: flex; gap: 15px; margin-bottom: 20px; }
        .btn-child { flex: 1; padding: 20px 10px; border: none; border-radius: 25px; font-size: 1.6rem; font-family: 'Gaegu'; cursor: pointer; background: #f0f0f0; transition: 0.3s; }
        .btn-child img { width: 100px; height: auto; margin-bottom: 10px; border-radius: 15px; transition: transform 0.3s ease; }
        .btn-child img.grow { transform: scale(2); }
        .btn-child.active.child1 { background: #ff9ff3; color: white; box-shadow: 0 5px 0 #ef87e5; }
        .btn-child.active.child2 { background: #48dbfb; color: white; box-shadow: 0 5px 0 #34c0e2; }
        .btn-child.active.child3 { background: #a29bfe; color: white; box-shadow: 0 5px 0 #8b82e8; }
        .child-name { cursor: text; padding: 2px 8px; border-radius: 8px; transition: background 0.2s; }
        .child-name:hover { background: rgba(0,0,0,0.1); }

        .time-box { background: #2d3436; color: #55efc4; border-radius: 25px; padding: 20px; text-align: center; margin-bottom: 20px; border: 4px solid #636e72; position: relative; }
        .time-label { color: #fff; font-size: 1.3rem; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .youtube-icon { width: 32px; height: 22px; background: #FF0000; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; }
        .youtube-icon::after { content: ''; width: 0; height: 0; border-left: 8px solid white; border-top: 5px solid transparent; border-bottom: 5px solid transparent; margin-left: 2px; }
        .time-display { font-size: 4rem; font-weight: bold; }
        .progress-bar { background: #636e72; border-radius: 10px; height: 12px; margin-top: 15px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #FF0000, #ff4d4d); height: 100%; border-radius: 10px; transition: width 0.3s ease; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: #f9f9f9; padding: 10px; border-radius: 15px; border: 2px solid #ddd; margin-bottom: 20px; }
        .day { height: 50px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #eee; position: relative; font-size: 1.2rem; }
        .day.vacation { background: #e3f2fd; border: 2px solid #2196f3; }
        .day.weekend { background: #fff0f0; color: #ff7675; }
        .day.selected { background: #feca57 !important; color: white; border: 3px solid #f39c12; }
        .day.has-data::after { content: '🐾'; position: absolute; top: 2px; right: 2px; font-size: 0.7rem; }

        .bonus-section { background: #fdf9ff; padding: 20px; border-radius: 25px; border: 3px dashed #a29bfe; }
        .book-row { display: grid; grid-template-columns: 30px 2fr 1fr; gap: 8px; margin-bottom: 10px; align-items: center; }
        input, textarea { padding: 12px; border: 2px solid #ddd; border-radius: 12px; font-family: 'Gaegu'; font-size: 1.1rem; width: 100%; box-sizing: border-box; }
        .calc-btn { width: 100%; padding: 20px; background: #6c5ce7; color: white; border: none; border-radius: 25px; font-size: 1.8rem; font-family: 'Gaegu'; cursor: pointer; margin-top: 15px; box-shadow: 0 5px 0 #5849c4; }
        .calc-btn img { transition: transform 0.3s ease; }
        .calc-btn img.grow { transform: scale(2); }

        /* 부모/아이 모드 */
        .lock-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; opacity: 0.5; transition: 0.2s; }
        .lock-btn:hover { opacity: 1; }
        .lock-btn.unlocked { opacity: 1; }

        /* 아이 모드에서 숨길 요소들 */
        body:not(.parent-mode) .settings-section { display: none; }
        body:not(.parent-mode) .add-rule-btn { display: none; }
        body:not(.parent-mode) .rule-item button { display: none; }
        body:not(.parent-mode) .rule-item input { border: none; pointer-events: none; background: transparent; }
        body:not(.parent-mode) .child-name { pointer-events: none; cursor: default; }
        body:not(.parent-mode) .child-name:hover { background: transparent; }
        body:not(.parent-mode) .btn-child img { pointer-events: none; }

        /* 로그인 화면 */
        .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        .login-screen img { width: 150px; margin-bottom: 20px; }
        .login-screen h1 { color: #6c5ce7; margin-bottom: 30px; }
        .login-btn { display: flex; align-items: center; gap: 10px; padding: 15px 30px; border: 2px solid #ddd; border-radius: 30px; background: white; font-size: 1.2rem; font-family: 'Gaegu'; cursor: pointer; margin: 10px 0; transition: 0.2s; }
        .login-btn:hover { background: #f5f5f5; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        .login-btn.google { border-color: #4285f4; }
        .login-btn.anon { border-color: #aaa; }
        .login-btn img { width: 24px; height: 24px; }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding: 10px 15px; background: #f0f0f0; border-radius: 20px; font-size: 0.95rem; }
        .user-info img { width: 30px; height: 30px; border-radius: 50%; }
        .logout-btn { background: #ff7675; color: white; border: none; padding: 5px 12px; border-radius: 10px; cursor: pointer; font-family: 'Gaegu'; }
        .app-content { display: none; }
        body.logged-in .login-screen { display: none; }
        body.logged-in.has-family .app-content { display: block; }

        /* 가족 설정 화면 */
        .family-screen { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; }
        body.logged-in:not(.has-family) .family-screen { display: flex; }
        .family-screen img { width: 120px; margin-bottom: 20px; }
        .family-screen h2 { color: #6c5ce7; margin-bottom: 10px; }
        .family-screen p { color: #888; margin-bottom: 30px; text-align: center; }
        .family-btn { padding: 15px 30px; border: 2px solid #6c5ce7; border-radius: 20px; background: white; font-size: 1.1rem; font-family: 'Gaegu'; cursor: pointer; margin: 8px 0; width: 80%; max-width: 280px; transition: 0.2s; }
        .family-btn:hover { background: #6c5ce7; color: white; }
        .family-btn.primary { background: #6c5ce7; color: white; }
        .family-btn.primary:hover { background: #5849c4; }
        .family-code-display { background: #f5f0ff; border: 3px dashed #6c5ce7; border-radius: 15px; padding: 20px; margin: 20px 0; text-align: center; }
        .family-code-display .code { font-size: 2.5rem; color: #6c5ce7; letter-spacing: 5px; font-weight: bold; }
        .family-code-input { font-size: 1.5rem; text-align: center; letter-spacing: 3px; text-transform: uppercase; width: 200px; }
        .family-info { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 8px 12px; background: #f5f0ff; border-radius: 15px; font-size: 0.9rem; color: #6c5ce7; }
    </style>
</head>
<body>

<div class="container">
    <!-- 시작 화면 -->
    <div class="login-screen">
        <img src="file (45).png">
        <h1>핑크냥 튜브타임</h1>
        <button class="login-btn google" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> 부모님 로그인
        </button>
        <button class="login-btn anon" onclick="showKidsCodeEntry()">
            🧒 아이 입장 (코드 입력)
        </button>
        <div id="kids-code-area" style="display:none; margin-top:20px; text-align:center;">
            <input type="text" id="kids-family-code" class="family-code-input" placeholder="가족코드" maxlength="6">
            <br><br>
            <button class="family-btn primary" onclick="kidsJoinFamily()">입장하기</button>
        </div>
        <p style="color:#aaa; font-size:0.9rem; margin-top:20px;">부모님이 만든 가족코드로 입장하세요</p>
    </div>

    <!-- 가족 설정 화면 (부모 로그인 후) -->
    <div class="family-screen">
        <img src="file (45).png">
        <h2>가족 설정</h2>
        <p>가족 코드를 만들어서<br>아이들에게 알려주세요!</p>
        <button class="family-btn primary" onclick="createFamily()">👨‍👩‍👧‍👦 새 가족 만들기</button>
        <button class="family-btn" onclick="showJoinFamily()">🔑 기존 가족 코드 입력</button>
        <div id="join-family-area" style="display:none; margin-top:20px; text-align:center;">
            <input type="text" id="family-code-input" class="family-code-input" placeholder="ABC123" maxlength="6">
            <br><br>
            <button class="family-btn primary" onclick="joinFamily()">참여하기</button>
        </div>
        <div id="family-created-area" style="display:none;">
            <div class="family-code-display">
                <p style="margin:0 0 10px 0;">가족 코드</p>
                <div class="code" id="new-family-code"></div>
                <p style="margin:10px 0 0 0; font-size:0.9rem; color:#888;">이 코드를 아이들에게 알려주세요!</p>
            </div>
            <button class="family-btn primary" onclick="startApp()">시작하기</button>
        </div>
    </div>

    <!-- 앱 컨텐츠 -->
    <div class="app-content">
    <div id="family-info" class="family-info">
        🏠 가족코드: <strong id="display-family-code"></strong>
        <button class="logout-btn" onclick="leaveFamily()" style="margin-left:auto;">나가기</button>
    </div>
    <div id="user-info" class="user-info" style="display:none;">
        <img id="user-photo" src="">
        <span id="user-name"></span>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
    <button id="lock-btn" class="lock-btn" onclick="toggleParentMode()">🔒</button>
    <img src="file (45).png" class="main-cat"> <div class="header"><h1>핑크냥 튜브타임</h1></div>
    
    <div class="rule-box">
        <b>🐾 약속을 지켜요!</b>
        <div id="rules-container"></div>
        <button class="add-rule-btn" onclick="addRule()">+ 규칙 추가</button>
    </div>

    <div class="settings-section">
        <h3 onclick="toggleSettings()">⚙️ 시간 & 보너스 설정 ▼</h3>
        <div id="settings-content" class="settings-content">
            <div class="settings-grid">
                <div class="setting-item">
                    <label>평일 기본시간 (분)</label>
                    <input type="number" id="set-weekday" value="130" onchange="saveSettings()">
                </div>
                <div class="setting-item">
                    <label>주말 기본시간 (분)</label>
                    <input type="number" id="set-weekend" value="210" onchange="saveSettings()">
                </div>
                <div class="setting-item">
                    <label>평일 최대 책 권수</label>
                    <input type="number" id="set-books-weekday" value="5" onchange="saveSettings()">
                </div>
                <div class="setting-item">
                    <label>방학 최대 책 권수</label>
                    <input type="number" id="set-books-vacation" value="3" onchange="saveSettings()">
                </div>
                <div class="setting-item">
                    <label>첫 책 보너스 (쪽당 분)</label>
                    <input type="number" id="set-bonus-first" value="1" step="0.1" onchange="saveSettings()">
                </div>
                <div class="setting-item">
                    <label>추가 책 보너스 (쪽당 분)</label>
                    <input type="number" id="set-bonus-extra" value="0.5" step="0.1" onchange="saveSettings()">
                </div>
                <div class="setting-item">
                    <label>방학 시작일</label>
                    <input type="date" id="set-vacation-start" onchange="saveSettings()">
                </div>
                <div class="setting-item">
                    <label>방학 종료일</label>
                    <input type="date" id="set-vacation-end" onchange="saveSettings()">
                </div>
            </div>
        </div>
    </div>

    <div class="child-selector">
        <button id="btn-child1" class="btn-child active child1" onclick="changeChild('child1')">
            <img id="img-child1" src="file (16).png" onclick="event.stopPropagation(); cycleImage('child1')"><br>
            <span id="name-child1" class="child-name" onclick="event.stopPropagation(); editChildName('child1')">아이1</span>
        </button>
        <button id="btn-child2" class="btn-child child2" onclick="changeChild('child2')">
            <img id="img-child2" src="file (18).png" onclick="event.stopPropagation(); cycleImage('child2')"><br>
            <span id="name-child2" class="child-name" onclick="event.stopPropagation(); editChildName('child2')">아이2</span>
        </button>
        <button id="btn-child3" class="btn-child child3" onclick="changeChild('child3')">
            <img id="img-child3" src="file (45).png" onclick="event.stopPropagation(); cycleImage('child3')"><br>
            <span id="name-child3" class="child-name" onclick="event.stopPropagation(); editChildName('child3')">아이3</span>
        </button>
    </div>

    <div class="time-box">
        <div id="selected-date-text" style="color:#aaa; font-size:1rem;">날짜 선택</div>
        <div class="time-label"><span class="youtube-icon"></span> 오늘 남은 유튜브 시간</div>
        <div id="time-display" class="time-display">00:00:00</div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill" style="width: 100%;"></div></div>
    </div>

    <div id="calendar" class="calendar-grid"></div>

    <div id="bonus-panel" style="display:none;">
        <h3 id="bonus-title" style="margin: 0 0 10px 0; color: #6c5ce7; text-align: center;">📖 독서 보너스 충전</h3>
        <div class="bonus-section">
            <div id="book-inputs"></div>
            <textarea id="review" style="width:100%; margin-top:10px;" placeholder="어떤 장면이 가장 기억에 남니?"></textarea>
            <button class="calc-btn" onclick="saveAndSend()"><img src="file (41).png" style="width: 128px; height: auto; vertical-align: middle; margin-right: 8px;">시간 저장 및 전송</button>
        </div>
    </div>

    </div><!-- app-content 끝 -->
</div>

<script>
    // Firebase 설정
    const firebaseConfig = {
        apiKey: "AIzaSyDL1-fHGCk3X7Hk8WQe2iemIs-Y24XKYM8",
        authDomain: "pinknyang-tube.firebaseapp.com",
        projectId: "pinknyang-tube",
        storageBucket: "pinknyang-tube.firebasestorage.app",
        messagingSenderId: "303769730622",
        appId: "1:303769730622:web:f1348075a3ed75e7de5b6f"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let familyCode = null;
    const CAT_IMAGES = ['file (16).png', 'file (18).png', 'file (41).png', 'file (45).png'];

    // 페이지 로드 시 저장된 가족코드 확인 (아이용 자동 입장)
    window.addEventListener('load', async () => {
        const saved = localStorage.getItem('familyCode');
        if (saved && !currentUser) {
            try {
                const doc = await db.collection('families').doc(saved).get();
                if (doc.exists) {
                    familyCode = saved;
                    document.body.classList.add('logged-in', 'has-family');
                    document.getElementById('display-family-code').innerText = familyCode;
                    document.getElementById('user-info').style.display = 'none';
                    init();
                }
            } catch (e) {
                console.log('자동 입장 실패:', e);
            }
        }
    });

    // 인증 상태 감지 (부모 Google 로그인용)
    auth.onAuthStateChanged(async user => {
        currentUser = user;
        if (user) {
            document.body.classList.add('logged-in');
            document.getElementById('user-info').style.display = 'flex';
            document.getElementById('user-photo').src = user.photoURL || 'file (45).png';
            document.getElementById('user-name').innerText = user.displayName || '사용자';
            // 부모 계정에서 가족 코드 확인
            await checkParentFamilyCode();
        } else {
            document.body.classList.remove('logged-in');
            document.body.classList.remove('has-family');
            document.getElementById('user-info').style.display = 'none';
            familyCode = null;
        }
    });

    // 아이용 코드 입력 표시
    function showKidsCodeEntry() {
        document.getElementById('kids-code-area').style.display = 'block';
    }

    // 아이가 코드로 입장 (로그인 없이)
    async function kidsJoinFamily() {
        const code = document.getElementById('kids-family-code').value.toUpperCase().trim();
        if (code.length !== 6) {
            alert('6자리 가족코드를 입력해주세요!');
            return;
        }
        try {
            const doc = await db.collection('families').doc(code).get();
            if (!doc.exists) {
                alert('존재하지 않는 가족코드입니다!');
                return;
            }
            familyCode = code;
            localStorage.setItem('familyCode', code);
            document.body.classList.add('logged-in', 'has-family');
            document.getElementById('display-family-code').innerText = familyCode;
            document.getElementById('user-info').style.display = 'none'; // 아이는 로그인 정보 안 보임
            init();
        } catch (e) {
            alert('입장 실패: ' + e.message);
        }
    }

    // 부모 계정에서 가족 코드 확인
    async function checkParentFamilyCode() {
        try {
            // 1. 먼저 Firestore 사용자 문서에서 가족코드 확인
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            if (userDoc.exists && userDoc.data().familyCode) {
                const code = userDoc.data().familyCode;
                // 가족이 실제로 존재하는지 확인
                const familyDoc = await db.collection('families').doc(code).get();
                if (familyDoc.exists) {
                    familyCode = code;
                    localStorage.setItem('familyCode', code);
                    document.body.classList.add('has-family');
                    document.getElementById('display-family-code').innerText = familyCode;
                    init();
                    return;
                }
            }
            // 2. localStorage 확인 (백업)
            const saved = localStorage.getItem('familyCode');
            if (saved) {
                const doc = await db.collection('families').doc(saved).get();
                if (doc.exists) {
                    familyCode = saved;
                    document.body.classList.add('has-family');
                    document.getElementById('display-family-code').innerText = familyCode;
                    init();
                    return;
                }
            }
        } catch (e) {
            console.log('가족코드 확인 실패:', e);
        }
        document.body.classList.remove('has-family');
    }

    // 가족 코드 생성 (6자리 랜덤)
    function generateFamilyCode() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let code = '';
        for (let i = 0; i < 6; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    // 새 가족 만들기 (부모 전용)
    async function createFamily() {
        if (!currentUser) {
            alert('먼저 로그인해주세요!');
            return;
        }
        const code = generateFamilyCode();
        try {
            // Firestore에 가족 생성
            await db.collection('families').doc(code).set({
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                createdBy: currentUser.uid
            });
            // 부모 계정에 가족코드 저장 (자동 복구용)
            await db.collection('users').doc(currentUser.uid).set({
                familyCode: code,
                email: currentUser.email,
                displayName: currentUser.displayName
            }, { merge: true });
            familyCode = code;
            localStorage.setItem('familyCode', code);
            document.getElementById('new-family-code').innerText = code;
            document.getElementById('family-created-area').style.display = 'block';
            document.querySelector('.family-screen .primary').style.display = 'none';
            document.querySelector('.family-screen button:not(.primary)').style.display = 'none';
        } catch (e) {
            alert('가족 생성 실패: ' + e.message);
        }
    }

    // 가족 코드 입력 표시
    function showJoinFamily() {
        document.getElementById('join-family-area').style.display = 'block';
    }

    // 가족 참여 (부모가 기존 가족코드로 참여)
    async function joinFamily() {
        const code = document.getElementById('family-code-input').value.toUpperCase().trim();
        if (code.length !== 6) {
            alert('6자리 코드를 입력해주세요!');
            return;
        }
        try {
            const doc = await db.collection('families').doc(code).get();
            if (!doc.exists) {
                alert('존재하지 않는 가족 코드입니다!');
                return;
            }
            // 부모 계정에 가족코드 저장
            if (currentUser) {
                await db.collection('users').doc(currentUser.uid).set({
                    familyCode: code,
                    email: currentUser.email,
                    displayName: currentUser.displayName
                }, { merge: true });
            }
            familyCode = code;
            localStorage.setItem('familyCode', code);
            document.body.classList.add('has-family');
            document.getElementById('display-family-code').innerText = familyCode;
            init();
        } catch (e) {
            alert('참여 실패: ' + e.message);
        }
    }

    // 앱 시작 (가족 생성 후)
    function startApp() {
        document.body.classList.add('has-family');
        document.getElementById('display-family-code').innerText = familyCode;
        init();
    }

    // 가족 나가기
    function leaveFamily() {
        if (confirm('가족에서 나가시겠습니까?\n다시 참여하려면 가족 코드가 필요합니다.')) {
            localStorage.removeItem('familyCode');
            familyCode = null;
            document.body.classList.remove('has-family');
            // 가족 화면 초기화
            document.getElementById('join-family-area').style.display = 'none';
            document.getElementById('family-created-area').style.display = 'none';
            document.querySelector('.family-screen .primary').style.display = '';
            document.querySelector('.family-screen button:not(.primary)').style.display = '';
        }
    }

    // Google 로그인
    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(err => {
            alert('로그인 실패: ' + err.message);
        });
    }


    // 로그아웃
    function logout() {
        if (confirm('로그아웃 하시겠습니까?')) {
            auth.signOut();
        }
    }

    let currentChild = 'child1';
    let isParentMode = false;

    // 부모 모드 관련
    function loadPIN() {
        return localStorage.getItem('parentPIN') || '1234';
    }

    function savePIN(pin) {
        localStorage.setItem('parentPIN', pin);
    }

    function toggleParentMode() {
        if (isParentMode) {
            // 잠금
            isParentMode = false;
            document.body.classList.remove('parent-mode');
            document.getElementById('lock-btn').innerText = '🔒';
            document.getElementById('lock-btn').classList.remove('unlocked');
        } else {
            // PIN 입력
            const pin = prompt('부모 PIN을 입력하세요:');
            if (pin === loadPIN()) {
                isParentMode = true;
                document.body.classList.add('parent-mode');
                document.getElementById('lock-btn').innerText = '🔓';
                document.getElementById('lock-btn').classList.add('unlocked');

                // PIN 변경 옵션
                if (confirm('PIN을 변경하시겠습니까?')) {
                    const newPIN = prompt('새 PIN을 입력하세요 (숫자 4자리 권장):');
                    if (newPIN && newPIN.trim()) {
                        savePIN(newPIN.trim());
                        alert('PIN이 변경되었습니다!');
                    }
                }
            } else if (pin !== null) {
                alert('PIN이 틀렸습니다!');
            }
        }
    }

    const DEFAULT_NAMES = { child1: '아이1', child2: '아이2', child3: '아이3' };

    function loadChildNames() {
        const saved = localStorage.getItem('childNames');
        return saved ? JSON.parse(saved) : DEFAULT_NAMES;
    }

    function saveChildNames(names) {
        localStorage.setItem('childNames', JSON.stringify(names));
    }

    function renderChildNames() {
        const names = loadChildNames();
        ['child1', 'child2', 'child3'].forEach(id => {
            document.getElementById('name-' + id).innerText = names[id];
        });
    }

    function editChildName(childId) {
        if (!isParentMode) return;
        const names = loadChildNames();
        const newName = prompt('이름을 입력하세요:', names[childId]);
        if (newName && newName.trim()) {
            names[childId] = newName.trim();
            saveChildNames(names);
            renderChildNames();
        }
    }

    function cycleImage(childId) {
        if (!isParentMode) return;
        const img = document.getElementById('img-' + childId);
        const currentSrc = img.src.split('/').pop();
        const currentIndex = CAT_IMAGES.findIndex(f => currentSrc.includes(f.replace(/ /g, '%20')) || currentSrc.includes(f));
        const nextIndex = (currentIndex + 1) % CAT_IMAGES.length;
        img.src = CAT_IMAGES[nextIndex];
        localStorage.setItem('catImg-' + childId, CAT_IMAGES[nextIndex]);
    }

    function loadSavedImages() {
        ['child1', 'child2', 'child3'].forEach(childId => {
            const saved = localStorage.getItem('catImg-' + childId);
            if (saved) document.getElementById('img-' + childId).src = saved;
        });
    }

    const DEFAULT_RULES = [
        '📖 동시(짧은 시)나 글밥 적은 책은 보너스 제외!',
        '📖 같은 책은 3번까지만 읽을 수 있어요!',
        '📺 유튜브는 11시 이후 시청 가능해요!'
    ];

    function loadRules() {
        const saved = localStorage.getItem('rules');
        return saved ? JSON.parse(saved) : DEFAULT_RULES;
    }

    function saveRules(rules) {
        localStorage.setItem('rules', JSON.stringify(rules));
    }

    function renderRules() {
        const rules = loadRules();
        const container = document.getElementById('rules-container');
        container.innerHTML = rules.map((rule, i) => `
            <div class="rule-item">
                <span>•</span>
                <input type="text" value="${rule}" onchange="updateRule(${i}, this.value)">
                <button onclick="deleteRule(${i})">×</button>
            </div>
        `).join('');
    }

    function addRule() {
        const rules = loadRules();
        rules.push('새 규칙을 입력하세요');
        saveRules(rules);
        renderRules();
    }

    function updateRule(index, value) {
        const rules = loadRules();
        rules[index] = value;
        saveRules(rules);
    }

    function deleteRule(index) {
        const rules = loadRules();
        rules.splice(index, 1);
        saveRules(rules);
        renderRules();
    }

    // 설정 관련
    const DEFAULT_SETTINGS = {
        weekdayMins: 130,
        weekendMins: 210,
        booksWeekday: 5,
        booksVacation: 3,
        bonusFirst: 1,
        bonusExtra: 0.5,
        vacationStart: '2026-02-19',
        vacationEnd: '2026-02-27'
    };

    function loadSettings() {
        const saved = localStorage.getItem('settings');
        return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
    }

    function saveSettings() {
        const settings = {
            weekdayMins: parseInt(document.getElementById('set-weekday').value) || 130,
            weekendMins: parseInt(document.getElementById('set-weekend').value) || 210,
            booksWeekday: parseInt(document.getElementById('set-books-weekday').value) || 5,
            booksVacation: parseInt(document.getElementById('set-books-vacation').value) || 3,
            bonusFirst: parseFloat(document.getElementById('set-bonus-first').value) || 1,
            bonusExtra: parseFloat(document.getElementById('set-bonus-extra').value) || 0.5,
            vacationStart: document.getElementById('set-vacation-start').value || '2026-02-19',
            vacationEnd: document.getElementById('set-vacation-end').value || '2026-02-27'
        };
        localStorage.setItem('settings', JSON.stringify(settings));
        selectDate(selectedDate);
    }

    function renderSettings() {
        const s = loadSettings();
        document.getElementById('set-weekday').value = s.weekdayMins;
        document.getElementById('set-weekend').value = s.weekendMins;
        document.getElementById('set-books-weekday').value = s.booksWeekday;
        document.getElementById('set-books-vacation').value = s.booksVacation;
        document.getElementById('set-bonus-first').value = s.bonusFirst;
        document.getElementById('set-bonus-extra').value = s.bonusExtra;
        document.getElementById('set-vacation-start').value = s.vacationStart;
        document.getElementById('set-vacation-end').value = s.vacationEnd;
    }

    function toggleSettings() {
        const content = document.getElementById('settings-content');
        content.classList.toggle('show');
    }

    let selectedDate = new Date().toISOString().split('T')[0];
    let cloudData = {};

    async function init() { loadSavedImages(); renderChildNames(); renderRules(); renderSettings(); await loadCloudData(); selectDate(selectedDate); }

    async function loadCloudData() {
        if (!familyCode) return;
        try {
            const doc = await db.collection('families').doc(familyCode)
                .collection('children').doc(currentChild).get();
            cloudData = doc.exists ? doc.data().records || {} : {};
            renderCalendar();
        } catch (e) {
            console.log("데이터 로드 실패:", e);
            cloudData = {};
            renderCalendar();
        }
    }

    function isVacation(dateStr) {
        const settings = loadSettings();
        const d = new Date(dateStr);
        const start = new Date(settings.vacationStart);
        const end = new Date(settings.vacationEnd);
        return d >= start && d <= end;
    }

    function renderCalendar() {
        const cal = document.getElementById('calendar'); cal.innerHTML = '';
        const now = new Date();
        const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
        const lastDate = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) cal.appendChild(document.createElement('div'));
        for (let d = 1; d <= lastDate; d++) {
            const dateStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
            const dayNum = new Date(dateStr).getDay();
            const dayEl = document.createElement('div');
            dayEl.className = `day ${[0,6].includes(dayNum) ? 'weekend' : ''} ${isVacation(dateStr) ? 'vacation' : ''} ${dateStr === selectedDate ? 'selected' : ''}`;
            if (cloudData[dateStr]) dayEl.classList.add('has-data');
            dayEl.innerText = d; dayEl.onclick = () => selectDate(dateStr);
            cal.appendChild(dayEl);
        }
    }

    function selectDate(dateStr) {
        selectedDate = dateStr;
        const dayNum = new Date(dateStr).getDay();
        const isWeekend = [0,6].includes(dayNum);
        const vacation = isVacation(dateStr);
        const settings = loadSettings();

        // 보너스 입력 칸 생성
        const maxBooks = (vacation && !isWeekend) ? settings.booksVacation : settings.booksWeekday;
        const inputArea = document.getElementById('book-inputs');
        inputArea.innerHTML = '';
        for (let i = 1; i <= maxBooks; i++) {
            inputArea.innerHTML += `<div class="book-row"><span>${i}</span><input type="text" id="t-${i}" placeholder="책 제목"><input type="number" id="p-${i}" placeholder="쪽수"></div>`;
        }
        document.getElementById('bonus-title').innerText = `📖 독서 보너스 (${maxBooks}권 제한)`;

        const existing = cloudData[dateStr];
        if (existing) {
            updateDisplay(existing.totalTime);
            document.getElementById('review').value = existing.review || '';
            const books = (existing.books || "").split(', ');
            books.forEach((b, idx) => {
                if (idx < maxBooks) {
                    const match = b.match(/(.*)\((\d+)쪽\)/);
                    if (match) { document.getElementById(`t-${idx+1}`).value = match[1]; document.getElementById(`p-${idx+1}`).value = match[2]; }
                }
            });
        } else {
            updateDisplay((isWeekend ? settings.weekendMins : settings.weekdayMins) * 60);
        }

        document.getElementById('selected-date-text').innerText = `${dateStr} (${isWeekend ? '주말' : (vacation ? '방학' : '평일')})`;
        document.getElementById('bonus-panel').style.display = (isWeekend || vacation) ? 'block' : 'none';
        renderCalendar();
    }

    function updateDisplay(s) {
        const h = Math.floor(s/3600).toString().padStart(2,'0');
        const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
        document.getElementById('time-display').innerText = `${h}:${m}:00`;

        // 진행바 업데이트
        const settings = loadSettings();
        const dayNum = new Date(selectedDate).getDay();
        const isWeekend = [0,6].includes(dayNum);
        const maxMins = (isWeekend ? settings.weekendMins : settings.weekdayMins) + 120; // 최대 보너스 예상치
        const currentMins = s / 60;
        const percent = Math.min((currentMins / maxMins) * 100, 100);
        document.getElementById('progress-fill').style.width = percent + '%';
    }

    async function saveAndSend() {
        const allCats = document.querySelectorAll('.main-cat, .btn-child img, .calc-btn img');
        allCats.forEach(cat => cat.classList.add('grow'));
        setTimeout(() => allCats.forEach(cat => cat.classList.remove('grow')), 1000);

        const settings = loadSettings();
        let mins = 0; let count = 0; let books = [];
        const inputs = document.querySelectorAll('.book-row').length;
        for (let i = 1; i <= inputs; i++) {
            const p = parseInt(document.getElementById(`p-${i}`).value);
            const t = document.getElementById(`t-${i}`).value;
            if (p && t) { count++; mins += (count === 1) ? (p * settings.bonusFirst) : (p * settings.bonusExtra); books.push(`${t}(${p}쪽)`); }
        }
        if (count === 0) return alert("책 제목과 쪽수를 입력해줘!");

        const isWeekend = [0,6].includes(new Date(selectedDate).getDay());
        const baseMins = isWeekend ? settings.weekendMins : settings.weekdayMins;
        const record = { totalTime: (baseMins + mins) * 60, books: books.join(', '), review: document.getElementById('review').value };

        try {
            if (!familyCode) throw new Error('가족 코드가 필요합니다');
            cloudData[selectedDate] = record;
            await db.collection('families').doc(familyCode)
                .collection('children').doc(currentChild)
                .set({ records: cloudData }, { merge: true });
            alert(`🐾 저장 완료! 오늘도 멋진 독서였어!`);
            renderCalendar();
        } catch (e) {
            console.log(e);
            alert("전송 실패! 인터넷 연결을 확인해줘.");
        }
    }

    async function changeChild(n) {
        currentChild = n;
        document.getElementById('btn-child1').classList.toggle('active', n === 'child1');
        document.getElementById('btn-child2').classList.toggle('active', n === 'child2');
        document.getElementById('btn-child3').classList.toggle('active', n === 'child3');
        await loadCloudData();
        selectDate(selectedDate);
    }
</script>
</body>
</html>
